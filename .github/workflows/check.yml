name: check

# Validates the plugin, the hook, the skills and scans for keys on every push to main and every pull request,
# runs the unit tests (Node and Python) and the Design Score fixtures, and, on Linux, macOS and Windows, runs both
# hooks with the system's own bash and installs then uninstalls the harness for every agent.
# Node 24 is an LTS line (security support into 2028); the installers job uses each runner's own Node.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so check.mjs can read the base commit: a published Design Score version is held to what the
      # base recorded, not to docs/score/versions.json in the same change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .github/scripts/check.mjs
        env:
          # pull request: its base branch's commit; push to main: the commit main was at before the push
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_BASE_FROM: ${{ github.event_name == 'pull_request' && 'the pull request base' || 'main before this push' }}

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The Design Score fixture test drives the runner's Chrome through puppeteer-core: the version
      # reviewed in SECURITY.md, installed without scripts into a temp folder, never into the repo.
      - name: puppeteer-core for the Design Score fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/pp" && cd "$RUNNER_TEMP/pp"
          npm install --no-save --ignore-scripts --no-audit --no-fund puppeteer-core@25.16.0
          echo "PUPPETEER_DIR=$RUNNER_TEMP/pp/node_modules/puppeteer-core" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      # DESIGN_SCORE_FIXTURES=required: the fixtures fail instead of skipping when Chrome or puppeteer-core is missing,
      # so a broken setup step cannot leave this job green with the fixtures never run.
      - name: unit tests and Design Score fixtures
        env:
          DESIGN_SCORE_FIXTURES: required
        run: node --test --test-concurrency=2 $(find skills hooks .github -name '*.test.mjs' -not -path '*/node_modules/*' | sort)
      # Python tests are named *_test.py; the runner's python3 runs them with the standard library only.
      - name: Python unit tests
        run: |
          set -e
          files=$(git ls-files '*_test.py')
          test -n "$files" || { echo "::error::no *_test.py files found"; exit 1; }
          for f in $files; do echo "== $f"; python3 -m unittest -v "$f"; done

  installers:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: both hooks (the system's own bash; macOS ships bash 3.2, Windows runs Git Bash)
        shell: bash
        run: node --test hooks/install-gate.test.mjs hooks/session-start.test.mjs
      - name: install.sh / uninstall.sh, every agent
        if: runner.os != 'Windows'
        run: bash install/test/test-install.sh
      - name: install.ps1 / uninstall.ps1, every agent (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./install/test/test-install.ps1
      - name: install.ps1 / uninstall.ps1, every agent (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/test/test-install.ps1

  # The Node installer (cli/makkov-harness.mjs, install/node/), on every Node version package.json's engines allow,
  # on Linux, macOS and Windows. The same scenario suites drive it through install/test/node/ (the shell installers'
  # command line), and the sequence tests mix it with install.sh and install.ps1 on the same folders: after the last
  # uninstall each folder must be byte for byte as it was.
  node-installer:
    name: node installer (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: unit tests (fingerprints, command line, doctor, the package's contents)
        run: node --test install/node/node.test.mjs
      - name: the bash scenarios and sequences, run by the Node installer
        if: runner.os != 'Windows'
        run: bash install/test/test-install.sh
        env:
          MAKKOV_IMPL: node
      - name: sequences killed at random moments, Node installer, seed 4242 (a first install killed just after it took the lock)
        if: runner.os != 'Windows'
        run: bash install/test/test-sequences.sh 80 4242
        env:
          MAKKOV_IMPL: node
          MAKKOV_TEST_KILL: '1'
      - name: sequences mixing install.sh, the Node installer and install.ps1 (pwsh) on the same folders
        if: runner.os != 'Windows'
        run: bash install/test/test-sequences.sh 12 "$(( $(date +%j | sed 's/^0*//') * 100 + ${{ strategy.job-index }} ))"
        env:
          MAKKOV_IMPL: mixed
      - name: sequences mixing install.sh from this checkout with the Node installer from the packed npm package
        if: runner.os != 'Windows'
        run: |
          pk="$RUNNER_TEMP/pack" && mkdir -p "$pk"
          npm pack --ignore-scripts --pack-destination "$pk"
          tar -xzf "$pk"/makkov-harness-*.tgz -C "$pk"
          MAKKOV_NODE_BIN="$pk/package/cli/makkov-harness.mjs" bash install/test/test-sequences.sh 8 "$(( $(date +%j | sed 's/^0*//') * 100 + ${{ strategy.job-index }} ))"
        env:
          MAKKOV_IMPL: mixed
      - name: the PowerShell scenarios and sequences, run by the Node installer (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./install/test/test-install.ps1
        env:
          MAKKOV_IMPL: node
      - name: sequences mixing install.ps1 and the Node installer on the same folders (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/test/test-sequences.ps1 -Impl mixed -Runs 6 -Seed ((Get-Date).DayOfYear * 100 + ${{ strategy.job-index }})
      - name: sequences mixing install.sh (Git Bash), the Node installer and install.ps1 on the same folders
        if: runner.os == 'Windows'
        shell: bash
        run: bash install/test/test-sequences.sh 6 "$(( $(date +%j | sed 's/^0*//') * 100 + ${{ strategy.job-index }} ))"
        env:
          MAKKOV_IMPL: mixed
